name: Bug
description: A command fails, init edits a project wrong, or a command does not do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: 'The command, expected vs actual, and the output (--json if you can).' }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, description: 'The smallest project or page that shows it. Remove keys and personal data.', render: sh }
  - type: input
    id: env
    attributes: { label: Version and environment, placeholder: '@doubleagent-so/cli 0.1.0, Node 24, macOS / Linux / Windows, Next.js 15' }
